<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0e1224"/>
      <stop offset="100%" stop-color="#17122e"/>
    </linearGradient>
    <linearGradient id="borderStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="crystalMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#borderStroke)" stroke-width="14"/>

  <!-- Tome Pages / Wings -->
  <path d="M256 365 C195 380 135 355 86 315 C108 268 168 238 220 278 C242 295 252 330 256 365 Z"
        fill="#10162a" stroke="url(#pages)" stroke-width="22" stroke-linejoin="round"/>
  <path d="M256 365 C317 380 377 355 426 315 C404 268 344 238 292 278 C270 295 260 330 256 365 Z"
        fill="#1a1434" stroke="url(#pages)" stroke-width="22" stroke-linejoin="round"/>

  <!-- Bookmark -->
  <path d="M252 360 L252 430 L256 422 L260 430 L260 360 Z" fill="#38bdf8"/>

  <!-- Core Faceted Crystal -->
  <polygon points="256,80 346,205 256,380 166,205" fill="url(#crystalMain)"/>
  <polygon points="256,80 256,380 166,205" fill="#bae6fd" opacity="0.75"/>
  <polygon points="256,80 346,205 256,220" fill="#f0abfc" opacity="0.6"/>
  <polygon points="256,80 166,205 256,220" fill="#ffffff" opacity="0.9"/>

  <!-- Center Core Flare -->
  <circle cx="256" cy="215" r="18" fill="#ffffff"/>
  <circle cx="256" cy="74" r="14" fill="#ffffff"/>
</svg>
